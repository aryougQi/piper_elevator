services:
  piper_ros2:
    image: piper-elevator:humble
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    network_mode: host
    ipc: host
    gpus: all
    privileged: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      # GDM regenerates the desktop authorization cookie after each login.
      XAUTHORITY: /tmp/.docker.xauth
      QT_X11_NO_MITSHM: "1"
      # Gazebo Fortress' QtQuick 3D view needs a GLX or EGL context.  Forcing
      # Qt and Mesa into the old software-only path makes MinimalScene crash.
      XDG_RUNTIME_DIR: /tmp/runtime-root
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/tmp/.docker.xauth:ro
      - /dev:/dev
    working_dir: /workspace/ros2_ws
    stdin_open: true
    tty: true
    command: bash
