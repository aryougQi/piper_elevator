button_approach_planner:
  ros__parameters:
    button_pose_topic: /button_pose
    button_base_topic: /button_pose_base
    approach_pose_topic: /button_approach_pose
    status_topic: /button_approach/status

    base_frame: base_link
    # 闭合夹爪两指中心的最前端；不要用夹爪底座或相机作为规划点。
    end_effector_link: pika_fingertip_center_link
    planning_group: arm
    move_group_action: /move_action
    execute_action: /execute_trajectory
    gripper_action: /pika_gripper_controller/follow_joint_trajectory

    # Gazebo 粗规划前先闭合 Pika；真机模式不会由此参数自动驱动夹爪。
    close_gripper_before_plan: true
    closed_gripper_position_m: 0.0
    gripper_motion_seconds: 1.0

    # TCP 停在按钮表面前15cm；当前阶段不执行按压和视觉伺服。
    approach_distance_m: 0.15
    position_tolerance_m: 0.008
    # 锁住粗规划开始时的夹爪姿态，避免 joint6 绕接近轴转动。
    orientation_tolerance_rad: 0.02
    planning_time_seconds: 5.0
    planning_attempts: 5
    velocity_scaling: 0.10
    acceleration_scaling: 0.10

    tf_timeout_seconds: 0.25
    action_timeout_seconds: 30.0
    target_max_age_seconds: 1.0
    # 给操作者留出检查 RViz 规划结果并确认执行的时间。
    plan_max_age_seconds: 120.0
    max_target_drift_m: 0.03

    # Piper 基坐标系中的保守工作空间限制（米）。
    workspace_min: [-0.65, -0.65, 0.02]
    workspace_max: [0.65, 0.65, 0.75]

    # 真机配置默认禁止执行，且要求相机外参已经标定。
    simulation_mode: false
    camera_calibration_valid: false
    allow_execution: false
    # 只允许仿真 launch 覆盖为 true；真机始终保持手动确认。
    auto_plan_execute: false
