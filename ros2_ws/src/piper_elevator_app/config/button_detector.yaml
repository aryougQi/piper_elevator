button_detector:
  ros__parameters:
    # 默认使用 RealSense 彩图检测，并从对齐深度图计算三维位置。
    use_depth: true
    color_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/color/camera_info

    button_pixel_topic: /button_pixel
    button_pose_topic: /button_pose
    # 仅在 RGB-D 局部平面拟合成功时发布；姿态 +Z 是接近按钮的方向。
    button_surface_pose_topic: /button_surface_pose
    button_detections_topic: /button_detections
    button_valid_topic: /button_detection_valid
    button_confidence_topic: /button_detection_confidence
    debug_image_topic: /button_detector/debug_image
    # 运行时向 /button_selection 发布 String（如 3、up、open）选择目标。
    # 未选择时不发布 /button_pixel 和 /button_pose。
    button_selection_topic: /button_selection
    button_selected_topic: /button_selected
    # 粗定位前由 approach planner 锁定一次按钮世界坐标；眼在手上相机移动后，
    # 将该坐标重新投影到图像，只在局部窗口内恢复同一物理按钮。
    button_base_topic: /button_pose_base
    base_frame: base_link
    camera_frame: camera_color_optical_frame
    selected_button_class: ''
    # 仅供 Gazebo launch 覆盖。真机默认关闭，不假设现实面板固定为 3x3。
    simulation_layout_relabel: false
    # 初次锁定仍要求类别正确；锁定后允许同一局部框短时类别漂移，防止近景
    # 图标占满画面时 alarm/up/down 等语义抖动导致实机任务中断。
    preserve_selected_track_identity: true
    projected_reacquisition_enabled: true
    projected_reacquisition_radius_px: 60.0
    projected_reacquisition_ambiguity_margin_px: 20.0
    projected_reacquisition_tf_timeout: 0.03
    # 全图检测在投影附近没有候选框时，对锁定目标周围做一次局部放大推理。
    # 局部恢复后持续使用局部视图；一旦失败，同一帧自动退回全图检测。
    projected_local_detection_enabled: true
    projected_local_crop_size_px: 240
    projected_local_hold_seconds: 1.0
    simulation_panel_layout_labels: ['1', '2', '3', '4', up, down, open, close, alarm]

    # 相对路径会从 piper_elevator_app 的安装目录解析。
    model_path: models/elevator_buttons_yolov10s.onnx
    model_input_size: 1280
    # cuda: 必须使用 RTX GPU，加载失败时直接报错，避免静默退回慢速 CPU。
    # 调试无 GPU 环境时可临时改为 cpu；auto 才允许自动回退。
    inference_device: cuda
    # 订阅相机前先预热 CUDA，消除首帧内核初始化卡顿。
    warmup_iterations: 2
    # 完整三列面板在 home 视角下，中心 up 实测约 0.55；0.40 给帧间
    # 波动留出余量，同时仍高于相邻 down 被误判成 up 的约 0.26。
    confidence_threshold: 0.40
    nms_iou_threshold: 0.45

    # 类别直接读取新 YOLOv10 ONNX 的元数据。该模型专门检测电梯按钮，
    # 因此保留模型中的全部电梯按钮类别（上下、开关门、楼层等）。
    class_names:
      - __model_metadata__
    target_classes:
      - '*'

    # 只保留最新输入，避免 30 FPS 相机超过推理速度后积压旧帧。
    input_queue_size: 1
    # 与 RealSense 传感器数据 QoS 保持一致。
    reliable_input: false
    # RGB-D 只保留足够完成近似时间同步的少量帧。
    sync_queue_size: 2
    sync_slop_seconds: 0.08

    # 没有订阅者时跳过调试图复制、绘制和序列化。
    publish_debug_image: true
    debug_image_only_when_subscribed: true
    # 调试图仅供显示；降低尺寸可避免跨容器 raw 图分片卡顿。
    # 检测仍使用 848x480 原图，输出坐标也保持原图坐标系。
    debug_image_scale: 0.5
    # 0 表示跟随检测帧率发布；缩小后的带宽足以保持窗口流畅。
    debug_max_fps: 0.0
    # 设为 0 可关闭周期性能日志。
    performance_log_interval_seconds: 5.0

    # 归一化 ROI；默认检测整张图，现场可缩小到按钮面板区域。
    roi_x: 0.0
    roi_y: 0.0
    roi_width: 1.0
    roi_height: 1.0

    # 对检测框中心区域的深度取中位数，并用 MAD 排除飞点。
    depth_unit_scale: 0.001
    depth_inner_ratio: 0.45
    minimum_depth_samples: 20
    min_depth_m: 0.10
    max_depth_m: 2.00

    # 在按钮框内部拟合局部平面，为视觉伺服提供可靠表面法向。
    surface_inner_ratio: 0.70
    surface_minimum_samples: 30
    surface_maximum_samples: 400
    surface_max_residual_m: 0.004
    surface_max_tilt_degrees: 60.0
    surface_normal_smoothing_alpha: 0.25

    # 连续确认、漏检保持关联，以及指数平滑。丢失期间绝不让画面中另一个
    # 同名图标抢占物理按钮；80 帧覆盖视觉 Servo 的 5 s 有界续行窗口。
    required_stable_frames: 5
    max_missed_frames: 80
    tracking_minimum_iou: 0.15
    max_center_jump_ratio: 0.10
    position_smoothing_alpha: 0.35
