button_visual_servo:
  ros__parameters:
    # Pose 的位置是按钮中心，姿态 +Z 是从相机朝向按钮表面的接近方向。
    surface_pose_topic: /button_surface_pose
    target_pose_topic: /button_visual_servo/target_pose
    status_topic: /button_visual_servo/status
    completion_topic: /button_visual_servo/completed

    base_frame: base_link
    # 姿态闭环必须直接检查真实相机光轴，不能用夹爪 +Z 代替。
    camera_frame: camera_color_optical_frame
    end_effector_link: pika_fingertip_center_link
    planning_group: arm
    move_group_action: /move_action
    execute_action: /execute_trajectory
    servo_twist_topic: /servo_node/delta_twist_cmds
    servo_status_topic: /servo_node/status
    servo_start_service: /servo_node/start_servo
    servo_pause_service: /servo_node/pause_servo
    servo_unpause_service: /servo_node/unpause_servo
    hardware_gate_service: /piper_pika_control_gate/servo_enable
    hardware_gate_required: false
    hardware_gate_heartbeat_seconds: 0.20

    # 最终约束：指尖中心沿表面法向停在按钮前 30 mm。
    standoff_distance_m: 0.030
    minimum_standoff_m: 0.025
    distance_tolerance_m: 0.0025
    lateral_tolerance_m: 0.0030
    perpendicular_tolerance_rad: 0.05236
    # 先用 MoveIt Servo 连续跟踪到 75 mm，按钮仍在相机视野内。
    visual_handoff_distance_m: 0.075
    visual_distance_tolerance_m: 0.005
    visual_lateral_tolerance_m: 0.004
    visual_perpendicular_tolerance_rad: 0.06981
    required_stable_observations: 2

    # 如果先发生丢检，只有已经进入 90 mm 内才允许交接给最终直线段。
    vision_loss_handoff_max_distance_m: 0.090
    maximum_final_cartesian_distance_m: 0.065
    maximum_start_error_m: 0.20
    maximum_target_jump_m: 0.025
    servo_timeout_seconds: 90.0
    target_max_age_seconds: 0.75
    observation_timeout_seconds: 2.0

    # 50 Hz 连续速度控制，并同时做低通和加速度限幅。
    servo_control_rate_hz: 50.0
    linear_proportional_gain: 1.4
    angular_proportional_gain: 2.0
    # 相机光轴仍优先垂直按钮表面；仅将绕光轴滚转软限制在水平 +/-10 deg。
    # optical frame 的 -Y 视为画面向上，base_link +Z 作为重力竖直参考。
    level_roll_enabled: true
    level_reference_axis: [0.0, 0.0, 1.0]
    maximum_level_roll_rad: 0.17453
    # 限制单独的回正速度，避免为了画面水平快速甩腕。
    maximum_level_roll_speed_radps: 0.15
    maximum_linear_speed_mps: 0.080
    maximum_angular_speed_radps: 0.45
    maximum_linear_acceleration_mps2: 0.30
    maximum_angular_acceleration_radps2: 1.40
    command_smoothing_alpha: 0.50
    servo_deceleration_seconds: 0.25

    # 最后约 45 mm 由 Pilz LIN 一次规划、一次执行，避免逐步启停。
    position_tolerance_m: 0.002
    orientation_tolerance_rad: 0.025
    planning_time_seconds: 3.0
    planning_attempts: 3
    final_planning_pipeline: pilz_industrial_motion_planner
    final_planner_id: LIN
    velocity_scaling: 0.12
    acceleration_scaling: 0.10
    tf_timeout_seconds: 0.25
    action_timeout_seconds: 20.0

    workspace_min: [-0.65, -0.65, 0.02]
    workspace_max: [0.65, 0.65, 0.75]

    # launch 会按仿真/真机覆盖。真机默认必须标定且禁止执行。
    simulation_mode: false
    camera_calibration_valid: false
    allow_execution: false
